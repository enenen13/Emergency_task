metadata:
  name: 119番通報 緊急度判定プロトコル Ver.3 - protocol.yaml
  version: spreadsheet_aligned_v0.3.3
  created_from: /mnt/data/119_tuhou.pdf
  created_note: |
    PDF原本（pp.35-74）に忠実に修正した版。前版（validated_v0.2）で機械が補完していた
    箇所のうち、PDF原本と矛盾するものを訂正し、PDF原本に存在しないノードや選択肢は
    synthetic フラグとメタデータで明示した。医学的運用前には HUMAN_REVIEW.md と
    照合のうえ専門家レビューが必須。
  scope: 119番通報導入、共通バイタル、症候別21+1プロトコル（吐血・喀血を含む）
  source_page_basis: |
    PDF pages 35-74（フッター頁番号）。35-36が導入と共通バイタル、37以降が各症候。
    引用ページ番号は PDF のフッター値（PDFビューワ上の物理ページ番号ではない）。
  changelog_from_v0_2:
  - 'CPA キーワードから「喉が詰まった」「意識なし」を削除（PDF p.35 に記載なし）'
  - 'melena_amount 選択肢a の本文を「容器（ティッシュペーパー）」→「下着」に修正（PDF p.62）'
  - 'melena fallback の文言を PDF 通り「腹痛なく下着に血液が付着する程度」に修正'
  - 'convulsion_breath_signal の b（10秒未満 Y1）を非終端化し convulsion_pregnant へ接続（PDF p.42 Q4）'
  - 'convulsion_history（既往）を triage 質問から ☎ metadata_only に降格（PDF p.43 では ☎）'
  - 'consciousness_disorder_syncope: 40歳以上サブ質問を syncope_heart_history 側へ移動（PDF p.41 通り）。syncope_abdominal_pain の年齢分岐は廃止し PDF 通り a:はい→R2 / b:いいえ→Y2 に統一'
  - 'lumbar_chest_pain_40 の suspected_condition を 心疾患 → 急性冠症候群 に修正（PDF p.60）'
  - 'lumbar_presyncope_65 に suspected_condition 急性大動脈解離 を追加（PDF p.60 の典型的誤字「急性大王脈解離」を医学的正字で収録）'
  - 'lumbar_pain_quality_65 の suspected_condition 急性大動脈解離 を削除（PDF p.60 はこの行に疾患なし）'
  - 'back_dyspnea_recheck の suspected_condition 肺疾患 を追加（PDF p.49）'
  - 'pediatric_head_neck_trauma を age<16 に限定し、成人で「頭をぶつけた」と発話された場合 trauma へ流れるよう trauma route に頭部キーワードを追加'
  - 'numbness グラフ修正：numbness_stroke_symptoms の各選択肢から numbness_stroke_history へ next を張り、症状の triage は記録しつつ次質問に進めるよう「accumulate_triage」フラグを導入'
  - 'dyspnea ☎1（喘息）と ☎2（在宅医療）を PDF 通りそれぞれ 3問・2問に分解'
  - 'dyspnea common_cold_sweat の 40歳サブ質問（両者 R2）を info-only として追記'
  - 'dyspnea common_breathing の f（呼吸が苦しそう）を PDF p.37 通り「triage 無し（プロトコル不適用）」と記録（運用上の判定は fallback の R2）'
  - 'foreign_body_speak_cry / poisoning_speak_cry に c:不明 → R3 を明示'
  - '【ユーザー指摘対応】overview (概況の把握) に PDF p.35 の応答選択肢 a/b/c/(無印)/d を明示'
  - '【ユーザー指摘対応】entry_flow 各ノードに question_category と pdf_question_number を付与'
  - '【ユーザー指摘対応】injured_count, caller_relation, age, sex に conditional_on フラグを付与（PDF括弧書きの条件を構造化）'
  - '【ユーザー指摘対応】PDF p.36 Q8「症候別へ」の遷移メッセージを route_to_symptom_inquiry ノードとして追加'
  - '【ユーザー指摘対応】common_breathing に pdf_intro_vs_symptom_triage_note を追加（導入vs症候別の triage 適用差分を明示）'
  - '【v0.3.2 ハルシネーション除去】overview.b の route_to_protocol: trauma を削除（PDF p.35 で矢印なし）→ next: injured_count に変更'
  - '【v0.3.2 ハルシネーション除去】overview.d の triage_via_fallback: R3 を削除（PDF p.35 で空欄、推定だった）→ next: injured_count に変更'
  - '【v0.3.2 ハルシネーション除去】convulsion_generalized_common / convulsion_focal_common (synthetic_node) を削除し、PDF p.42-43 通りの直接エッジに置換'
  - '【v0.3.2 到達性確保】各プロトコルに terminal_followup_chain を追加し、☎ メタデータノードを導入から辿れるよう構造化（dyspnea/palpitation/syncope/convulsion/foreign_body/poisoning）'
  - '【v0.3.2 到達性確保】common_cold_sweat.a に followup_metadata: common_cold_sweat_age_subquestion を追加'
  - 【コード対応表反映】各 choice に code_label を付与し、protocol.yaml の a/b/c... と生成コードの数値ラベルの対応を明示
  - 【対象】common_breathing / common_conversation / convulsion_history_metadata / back・lumbar・abdominal pain_quality_65 / hematemesis_amount / melena_amount / malaise pain nodes
labels:
  R1:
    category: 赤
    description: 心肺蘇生の必要性が強く疑われる病態
    mednlp_call_mapping: Very urgent
  R2:
    category: 赤
    description: 高度な医学的判断・処置の必要性が高く、その開始までの時間に急を要する病態
    mednlp_call_mapping: Very urgent
  R3:
    category: 赤
    description: R2より低いが、迅速な到着と搬送が必要、または状況不明で確認を要する病態
    mednlp_call_mapping: Very urgent
  Y1:
    category: 黄
    description: 医学的判断の必要性は高いが、R2/R3ほどの迅速性は必要ない病態
    mednlp_call_mapping: Semi-urgent
  Y2:
    category: 黄
    description: 医学的判断の必要性はR1〜Y1ほど高くないが医療機関受診が必要な病態
    mednlp_call_mapping: Semi-urgent
  G:
    category: 緑
    description: 赤、黄には該当しないが診察が必要な病態
    mednlp_call_mapping: Low urgency
oral_instructions:
  CPR: 心肺蘇生指導
  airway_obstruction: 気道異物除去指導
  hemostasis: 止血の口頭指導
  finger_toe_amputation: 指趾切断の口頭指導
  poisoning: 中毒の口頭指導
  positioning: 体位管理の口頭指導
global_priority_rules:
- id: cpa_keywords
  priority: 100
  match_any:
  - 呼吸なし
  - 脈なし
  - 水没
  - 冷たくなっている
  - 首をつった
  - 首を絞めた
  triage: R1
  oral_instruction:
  - CPR
  - airway_obstruction
  source_pages:
  - 35
  pdf_verbatim: PDF p.35 概況の把握 a の「<キーワード> 呼吸なし・脈なし・水没・冷たく・首をつった・首を絞めた」と一致。
- id: external_trauma_keywords
  priority: 95
  match_any:
  - 交通外傷
  - 転落
  - 熱傷
  - 咬傷
  - 外因性
  route_to_protocol: trauma
  source_pages:
  - 35
  pdf_verbatim: PDF p.35 概況の把握 b の「（キーワードなしで）外因性・外傷（交通外傷、転落、熱傷、咬傷など）」と一致。
- id: convulsion_direct_route
  priority: 90
  match_any:
  - けいれん
  - 痙攣
  - ひきつけ
  route_to_protocol: convulsion
  source_pages:
  - 35
  pdf_verbatim: PDF p.35 概況の把握 c の「（キーワードなしで）けいれん」と一致。
entry_flow:
- id: intro_fire_or_emergency
  question: 火事ですか、救急ですか？
  question_category: 導入
  pdf_question_number: '1'
  choices:
  - code: a
    value: emergency
    text: 救急
    next: dispatch_location
  - code: b
    value: fire_or_other
    text: 火事、他
    route_to: non_medical_flow
  source_pages:
  - 35
- id: dispatch_location
  question: 救急車が出動する先の住所、電話番号の確認
  question_category: 出動先確認
  pdf_question_number: '2'
  metadata_only: true
  source_pages:
  - 35
  next: overview
- id: overview
  question: どなたが、どうしましたか？
  question_category: 概況の把握
  pdf_question_number: '3-1'
  source_pages:
  - 35
  choices:
  - code: a
    code_label: 1
    text: <キーワード> 呼吸なし・脈なし・水没・冷たく・首をつった・首を絞めた
    triage: R1
    oral_instruction:
    - CPR
    - airway_obstruction
    matches_rule: cpa_keywords
    pdf_verbatim_triage: R1 + 口頭指導
    note: PDF p.35 で唯一 triage 明示の選択肢。global_priority_rules の cpa_keywords と連動。
  - code: b
    code_label: 3
    text: （キーワードなしで）外因性・外傷（交通外傷、転落、熱傷、咬傷など）
    next: injured_count
    pdf_cell_blank: true
    pdf_verbatim_triage: BLANK
    note: |
      PDF p.35 の triage 欄は空欄（c のような「→●外傷へ」の矢印は無い）。
      回答内容が「外因性・外傷」と分類されることは記録するが、ルーティングは強制せず、
      通常通り entry_flow を継続。共通バイタル後の chief_complaint_router が trauma
      キーワードでマッチして trauma プロトコルへ振り分ける設計に統一。
      v0.3 までは route_to_protocol: trauma を直接付与していたが、これは PDF にない
      過剰補完だったため v0.3.2 で削除した。
  - code: c
    code_label: 2
    text: （キーワードなしで）けいれん
    route_to_protocol: convulsion
    pdf_routing_arrow: →●「6.けいれん」へ
    pdf_verbatim_triage: 矢印で convulsion へ直接ルーティング
    note: PDF p.35 で c の triage 欄に明示の矢印あり。entry_flow をスキップして convulsion へ直行する原本指示通り。
  - code: chief_complaint_classification
    code_label: 3
    text: 主訴の分類（胸が痛い、背中が痛いなど）
    pdf_code: '（無印）'
    pdf_response_label: <主訴の選択>
    next: injured_count
    note: |
      PDF p.35 の「応答選択肢番号」が無印（空欄）の行。triage 欄には「<主訴の選択>」と記載があり、
      これは主訴分類ステップ＝chief_complaint_router を経由することを意味する。
      通常 entry_flow を継続し、最終的に router で症候別プロトコルへ振り分けられる。
  - code: d
    code_label: 4
    text: 不明
    next: injured_count
    pdf_cell_blank: true
    pdf_verbatim_triage: BLANK
    note: |
      PDF p.35 の triage 欄は空欄。明示的な triage 指示もルーティングもないため、
      通常通り entry_flow を継続する設計に統一。
      v0.3 までは triage_via_fallback: R3 を付与していたが、これは PDF にない推定だったため
      v0.3.2 で削除した。共通バイタル後に主訴が判明しない場合は chief_complaint_router で
      マッチせず、運用上は別途案内が必要（実装側で要対応）。
  extract:
  - chief_complaint
  - cpa_keywords
  - trauma_or_external_cause
  - convulsion
  - unknown
  next: injured_count
- id: injured_count
  question: (複数の傷病者が疑われるとき・曖昧な時) 怪我をしたのは（病気なのは）何人ですか？
  question_category: 多数傷病者の否定
  pdf_question_number: '3-2'
  conditional_on: 複数の傷病者が疑われるとき・曖昧な時
  choices:
  - code: a
    text: 一人
    next: caller_relation
  - code: b
    text: 複数
    next: caller_relation
  source_pages:
  - 35
- id: caller_relation
  question: (本人からの通報ではない時、通報者が不明な時) 通報しているあなたは、どなた（家族の方、警察官の方）ですか？
  question_category: 通報者の確認
  pdf_question_number: '3-3'
  conditional_on: 本人からの通報ではない時、通報者が不明な時
  choices:
  - code: a
    text: 本人
    next: age
  - code: b
    text: 本人以外（①家族、②警察官、③通行人、④福祉施設、⑤その他、⑥不明）
    next: age
  - code: c
    text: 不明
    next: age
  source_pages:
  - 35
- id: age
  question: (ここまでで不明な場合) 年齢は、いくつぐらいですか？
  question_category: 年齢の確認
  pdf_question_number: '3-4'
  conditional_on: ここまでで年齢が不明な場合
  choices:
  - code: a
    text: ①4歳以下（乳幼児）、②5-14歳（小児）、③15-39歳（青年）、④40-69歳（壮年）、⑤70歳以上（高齢）、⑥85歳以上（超高齢）
    next: sex
  - code: b
    text: 不明
    next: sex
  source_pages:
  - 35
- id: sex
  question: (ここまでで不明な場合) 患者は、男性（男の子）ですか、女性（女の子）ですか？
  question_category: 性別の確認
  pdf_question_number: '3-5'
  conditional_on: ここまでで性別が不明な場合
  choices:
  - code: a
    text: 男
    next: observation
  - code: b
    text: 女
    next: observation
  - code: c
    text: 不明
    next: observation
  source_pages:
  - 35
- id: observation
  question: 今、直接、患者をみることができますか？（目の前にいますか？など）
  question_category: 観察の可否の確認
  pdf_question_number: '4'
  choices:
  - code: a
    code_label: 1
    text: 容態を観察している・観察した
    next: common_breathing
  - code: b
    code_label: 2
    text: 容態を観察していないし、観察できない
    triage: R3
    pdf_cell_blank: true
    note: PDF p.35「(見に行くことできなければ)」の行。triage 欄は空欄だが、見に行けない＝容態確認不能で R3 を採用。
  source_pages:
  - 35
common_vitals:
- id: common_breathing
  source_pages:
  - 35
  - 36
  - 37
  - 38
  - 40
  - 42
  - 43
  - 44
  - 46
  - 48
  - 50
  - 51
  - 53
  - 55
  - 57
  - 59
  - 61
  - 62
  - 63
  - 65
  - 67
  - 68
  - 69
  - 71
  - 73
  question: 呼吸は楽にしていますか？普段通りの呼吸ですか？
  question_category: 呼吸の確認
  pdf_question_number: '5'
  slot: breathing_status
  pdf_intro_vs_symptom_triage_note: |
    PDF p.35-36 の【119番導入プロトコル】版ではこの質問の triage 欄は b/c/e (R1+口頭指導) のみ
    記入されており、a/d/f/g は空欄。p.37 以降の【症候別プロトコル】版では d (いびき)=R2, f (呼吸が
    苦しそう)=R2 (※dyspnea p.37 のみ空欄), g (不明)=R3 が明示される。
    本 YAML では症候別ページの triage を採用し、導入フローと症候別フローで共通定義を再利用している。
    結果として「導入の時点で 呼吸=いびき と回答した場合に R2 が即時付与される」設計だが、
    PDF忠実には「導入では triage 付与せず、症候選択後に triage 確定」とも解釈できる。
    実装側で 2 段階分離が必要なら、common_breathing を intro_breathing と symptom_breathing に分けること。
  choices:
  - code: a
    code_label: 1
    value: normal
    text: はい
    action: next
    next: common_cold_sweat
  - code: b
    code_label: 2
    value: no_breathing
    text: いいえ（呼吸なし）
    triage: R1
    oral_instruction:
    - CPR
  - code: c
    code_label: 2
    value: agonal_breathing
    text: いいえ（死戦期呼吸を疑う）
    triage: R1
    oral_instruction:
    - CPR
  - code: d
    code_label: 3
    value: snoring
    text: いいえ（いびき）
    triage: R2
  - code: e
    code_label: 2
    value: choking
    text: いいえ（窒息）
    triage: R1
    oral_instruction:
    - airway_obstruction
  - code: f
    code_label: 3
    value: dyspnea
    text: 呼吸が苦しそう
    triage: R2
    note: |
      PDF p.37 (呼吸困難) ではこのセルが斜線で空欄（プロトコルの主訴と重複するため）。
      他のすべての症候別ページでは R2 が明示されているため、運用値として R2 を採用。
  - code: g
    code_label: 4
    value: unknown
    text: 不明
    triage: R3
- id: common_cold_sweat
  question: 冷や汗をかいていますか？
  question_category: 循環の確認
  pdf_question_number: '6-1'
  slot: cold_sweat
  choices:
  - code: a
    code_label: 1
    value: 'yes'
    text: はい
    triage: R2
    followup_metadata: common_cold_sweat_age_subquestion
    note: |
      PDF p.37 (呼吸困難) ではこの選択肢に「i 40歳以上 R2 / ii 40歳未満 R2」のサブ質問あり。
      両者とも R2 で triage に影響しないため、年齢サブ質問は info-only として
      common_cold_sweat_age_subquestion ノードに分離（applicable_protocols: [dyspnea] のみ発火）。
  - code: b
    code_label: 2
    value: 'no'
    text: いいえ
    action: next
    next: common_face_color
  - code: c
    code_label: 3
    value: unknown
    text: 不明
    triage: R3
- id: common_cold_sweat_age_subquestion
  source_pages:
  - 37
  applicable_protocols:
  - dyspnea
  question: (冷や汗ありの場合) 40歳以上ですか？
  metadata_only: true
  choices:
  - code: i
    text: 40歳以上
    affects_triage: false
  - code: ii
    text: 40歳未満
    affects_triage: false
  note: PDF p.37 のみで観測される情報サブ質問。R2 の triage は変更しない。
- id: common_face_color
  question: 顔色は悪いですか？
  question_category: 顔色の確認
  pdf_question_number: '6-2'
  slot: face_color
  choices:
  - code: a
    code_label: 1
    value: bad
    text: 悪い
    triage: R2
  - code: b
    code_label: 2
    value: normal
    text: 悪くない（いつもと同じ、赤色）
    action: next
    next: common_conversation
  - code: c
    code_label: 3
    value: unknown
    text: 不明
    triage: R3
- id: common_conversation
  question: 普通に話しができますか？
  slot: conversation_status
  question_category: 意識の確認
  pdf_question_number: '7'
  choices:
  - code: a
    code_label: 1
    value: normal
    text: はい
    action: next
    next: route_to_symptom_inquiry
  - code: b
    code_label: 2
    value: confused
    text: いいえ（つじつまが合わない）
    triage: R2
  - code: c
    code_label: 2
    value: words_only
    text: いいえ（単語しか話せない）
    triage: R2
  - code: d
    code_label: 2
    value: groaning
    text: いいえ（うめき声のみ）
    triage: R2
  - code: e
    code_label: 2
    value: no_voice
    text: いいえ（声が全く出ない）
    triage: R2
  - code: f
    code_label: 2
    value: unclear_content
    text: いいえ（内容不明）
    triage: R2
  - code: g
    code_label: 2
    value: dyspnea_conversation_difficult
    text: いいえ（意識は問題がないが、呼吸苦で話しができない）途切れ途切れの会話
    triage: R2
  - code: i
    code_label: 3
    value: unknown
    text: 不明
    triage: R3
    pdf_index_skip_note: PDF原本では h をスキップして i を不明に充てている（原本の表記そのまま）。
- id: route_to_symptom_inquiry
  question: それでは、（◯◯）について、もう少しお聞きします。
  question_category: 症候別へ
  pdf_question_number: '8'
  source_pages:
  - 36
  transition_only: true
  description: |
    PDF p.36 Q8 の遷移メッセージ。主訴分類に応じて症候別インタビュー(chief_complaint_router)
    に分岐するための案内文。◯◯部分は overview で抽出した主訴名（例：胸が痛い、頭痛、しびれ など）
    で埋められる。triage は付与しない。
  next: chief_complaint_router
chief_complaint_router:
  id: chief_complaint_router
  source_pages:
  - 5
  - 6
  - 35
  routes:
  - protocol: dyspnea
    match_any:
    - 息が苦しい
    - 呼吸が苦しい
    - 息苦しい
    - ゼーゼー
    - ヒューヒュー
    - 喘息
    - 肩で息をしている
    - 息ができない
    - 痰がからんだ
  - protocol: palpitation
    match_any:
    - 動悸
    - どきどきする
    - 胸がどきどきする
  - protocol: consciousness_disorder_syncope
    match_any:
    - 反応がない
    - 意識がない
    - 失神
    - 倒れた
    - 変なことを言う
    - うわごと
    - いつもと様子が違う
    - 気を失った
  - protocol: convulsion
    match_any:
    - けいれん
    - 痙攣
    - ひきつけ
  - protocol: headache
    match_any:
    - 頭痛
    - 頭が痛い
    - 後頭部が痛い
  - protocol: chest_pain_nontraumatic
    match_any:
    - 胸が痛い
    - 胸が苦しい
    - 胸痛
  - protocol: back_pain
    match_any:
    - 背中が痛い
    - 背骨が痛い
    - 背部痛
  - protocol: adult_fever
    age_condition: age >= 16
    match_any:
    - 熱
    - 発熱
    - 熱が高い
  - protocol: abdominal_pain
    match_any:
    - おなかが痛い
    - 腹痛
    - みぞおちが痛い
    - 下腹が痛い
    - わき腹が痛い
    - 足の付け根が痛い
  - protocol: adult_nausea_vomiting
    age_condition: age >= 16
    match_any:
    - 吐いた
    - 吐き気
    - 嘔吐
  - protocol: dizziness
    match_any:
    - めまい
    - 目が回る
  - protocol: numbness
    match_any:
    - しびれ
    - 麻痺
    - 手足に力が入らない
    - 脳卒中
    - 突然話せない
    - バランスがとれない
    - 突然目が見えない
  - protocol: lumbar_pain
    match_any:
    - 腰が痛い
    - 腰痛
  - protocol: hematemesis_hemoptysis
    match_any:
    - 吐血
    - 喀血
    - 血を吐いた
  - protocol: melena_hematochezia
    match_any:
    - 下血
    - 血便
    - 便に血
  - protocol: malaise
    match_any:
    - 具合が悪い
    - 気分が悪い
    - 具合が悪そう
    - 気分が悪そう
  - protocol: trauma
    match_any:
    - けが
    - 怪我
    - 外傷
    - 交通事故
    - 転落
    - やけど
    - 熱傷
    - 咬傷
    - 頭をぶつけた
    - 頭部外傷
    - 頸部外傷
    age_condition: age >= 16 OR age unknown
    note: 頭・頸部外傷キーワードは成人または年齢不明時に trauma へ流す。pediatric_head_neck_trauma が age<16 で先に拾う場合あり。
  - protocol: foreign_body_ingestion
    match_any:
    - 固形物
    - 飲み込んだ
    - 喉につかえた
    - 喉に引っかかった
    - 喉が詰まった
  - protocol: poisoning
    match_any:
    - 中毒
    - 薬を飲んだ
    - ガスを吸った
    - 間違って飲んだ
  - protocol: pediatric_fever
    age_condition: age < 16
    match_any:
    - 熱
    - 発熱
    - 熱が高い
  - protocol: pediatric_nausea_vomiting
    age_condition: age < 16
    match_any:
    - 吐いた
    - 吐き気
    - 嘔吐
  - protocol: pediatric_head_neck_trauma
    age_condition: age < 16
    match_any:
    - 頭をぶつけた
    - 頭から血
    - 頭部外傷
    - 頸部外傷
    - 落ちた
protocols:
- id: dyspnea
  name: 呼吸困難
  source_pages:
  - 37
  symptom_examples:
  - 息が苦しい
  - 呼吸が苦しい
  - 息苦しい
  - 肩で息をしている
  - 息ができない
  - ゼーゼーいっている
  - ヒューヒューいっている
  - 息をするときに音がする
  - 痰がからんだような音がする
  - 喘息なんですが
  inherits:
  - common_vitals
  start_after_common_vitals: true
  terminal_followup_chain:
  - dyspnea_info_asthma_history
  - dyspnea_info_inhaler_held
  - dyspnea_info_inhaler_used
  - dyspnea_info_homecare_doctor_instruction
  - dyspnea_info_homecare_followed
  terminal_followup_note: |
    PDF p.37 の ☎1 / ☎2 で記載される情報項目。緊急度確定後に申し送り情報として収集する。
    順序: 喘息既往 → (yes時) 吸入薬所持 → (yes時) 使用したか → 在宅医療指示 → (yes時) 実施したか
  nodes:
  - id: dyspnea_terminal
    question: 上記、呼吸・循環・意識に異常がない呼吸困難
    triage: R2
  - id: dyspnea_info_asthma_history
    phone_icon: ☎1
    question: 喘息の持病はありますか？
    metadata_only: true
  - id: dyspnea_info_inhaler_held
    phone_icon: ☎1
    question: (喘息の既往がある場合) 吸入薬を持っていますか？
    metadata_only: true
    conditional_on: dyspnea_info_asthma_history == yes
  - id: dyspnea_info_inhaler_used
    phone_icon: ☎1
    question: (吸入薬を持っている場合) それを使用しましたか？
    metadata_only: true
    conditional_on: dyspnea_info_inhaler_held == yes
  - id: dyspnea_info_homecare_doctor_instruction
    phone_icon: ☎2
    question: ※気管切開や人工呼吸などの在宅医療に関する呼吸困難の場合 — このような状況での特別な機器の使用や指示を、かかりつけの医師から受けていますか？
    metadata_only: true
  - id: dyspnea_info_homecare_followed
    phone_icon: ☎2
    question: (医師による指示がある場合) それを行いましたか？
    metadata_only: true
    conditional_on: dyspnea_info_homecare_doctor_instruction == yes
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: R2
  notes: 呼吸困難は共通バイタルで異常なしでも R2（dyspnea_terminal）。☎項目は緊急度には影響しないが救急隊・医療機関への共有情報として保持する。
- id: palpitation
  name: 動悸
  source_pages:
  - 38
  - 39
  symptom_examples:
  - どきどきする
  - 胸がどきどきする
  - 動悸がする
  inherits:
  - common_vitals
  start_after_common_vitals: true
  terminal_followup_chain:
  - palpitation_icd_fired
  - palpitation_medication_info
  terminal_followup_note: |
    PDF p.39 の ☎ 情報項目。palpitation_icd_fired は heart_history=yes でICD植え込みありの場合に
    のみ意味を持つ条件付き質問。palpitation_medication_info は無条件の薬剤履歴。
  nodes:
  - id: palpitation_heart_history
    question: これまで心臓の異常を指摘されたことがありますか？
    suspected_condition: 心疾患
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
      followup_metadata: palpitation_icd_fired
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
      action: next
      next: palpitation_chest_pain
    - code: c
      code_label: 3
      value: unknown
      text: 不明
      pdf_cell_blank: true
      triage: R3
      note: PDF p.39 ではセル空欄（fallback「不明な項目がある場合 R3」で吸収される）。実装上は明示。
    source_pages:
    - 39
  - id: palpitation_icd_fired
    question: (1-1で「体内式埋め込み型除細動器」が植え込みが確認された場合) 30分以内に体内式埋め込み型除細動器は、発動しましたか？
    suspected_condition: 体内式埋め込み型除細動器の発動
    conditional_on: palpitation_heart_history == yes AND ICD implanted
    note: |
      PDF p.39 で Q1 のサブ質問として実装されている。Q1=はい は既に R2 終端だが、
      ICD 植え込み確認時の追加情報として尋ねる。本 YAML では到達不能ノードとして残し、
      情報項目として救急隊申し送りに利用する位置づけ（unreachable_but_informational）。
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      triage: Y2
      code_label: 2
      value: 'no'
      text: いいえ
      pdf_cell_blank: true
      note: PDF原本でセル空欄。
    - code: c
      triage: R3
      code_label: 3
      value: unknown
      text: 不明
      pdf_cell_blank: true
      note: PDF原本でセル空欄。
    source_pages:
    - 39
  - id: palpitation_chest_pain
    question: 胸痛はありますか？
    suspected_condition: 急性冠症候群
    choices:
    - code: a-i
      code_label: 1
      value: yes_age_40_or_more
      text: はい・40歳以上
      triage: R2
    - code: a-ii
      code_label: 2
      value: yes_age_under_40
      text: はい・40歳未満
      triage: Y2
    - code: b
      code_label: 3
      value: 'no'
      text: いいえ
      action: next
      next: palpitation_medication_info
      pdf_cell_blank: true
    - code: c
      code_label: 4
      value: unknown
      text: 不明
      pdf_cell_blank: true
      triage: R3
  - id: palpitation_medication_info
    phone_icon: ☎
    question: 12時間以内に、何か薬を使用しましたか？（治療薬や市販薬の薬品名）
    metadata_only: true
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: consciousness_disorder_syncope
  name: 意識障害／失神
  source_pages:
  - 40
  - 41
  symptom_examples:
  - 反応がない
  - 意識がないようだ
  - 変なことを言う
  - うわごとを言っている
  - いつもと様子が違う
  - 気を失った
  - 気を失いかけた
  inherits:
  - common_vitals
  start_after_common_vitals: true
  terminal_followup_chain:
  - syncope_age_40_subquestion
  terminal_followup_note: |
    syncope_age_40_subquestion は PDF p.41 で syncope_heart_history.a (はい) のサブ質問として
    配置されているもの。条件付き (heart_history==yes時のみ) で情報収集する。
  nodes:
  - id: syncope_breath_count
    question: (呼吸、意識の状態から、呼吸停止の可能性が否定できない場合) それでは、今から傷病者をみて、呼吸をする度に私に合図してください。
    suspected_condition: 心停止
    choices:
    - code: a
      code_label: 1
      value: interval_10sec_or_more
      text: 10秒以上（死戦期呼吸）
      triage: R1
      oral_instruction:
      - CPR
    - code: b
      code_label: 2
      value: under_10sec
      text: 10秒未満
      action: next
      next: syncope_heart_history
      pdf_cell_blank: true
    - code: c
      code_label: 3
      value: unable
      text: 実施できず
      triage: R3
  - id: syncope_heart_history
    question: これまで心臓の異常を指摘されたことがありますか？
    suspected_condition: 心疾患・不整脈
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
      followup_metadata: syncope_age_40_subquestion
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
      action: next
      next: syncope_abdominal_pain
      pdf_cell_blank: true
    - code: c
      code_label: 3
      value: unknown
      text: 不明
      pdf_cell_blank: true
      triage: R3
      note: PDF原本では c のセル空欄。fallback で R3。
  - id: syncope_age_40_subquestion
    question: (心臓の異常を指摘されたことが「はい」の場合) 40歳以上ですか？
    metadata_only: true
    conditional_on: syncope_heart_history == yes
    note: |
      PDF p.41 では syncope_heart_history の「a はい R2」直下に配置されたサブ質問。
      triage 列が空欄のため緊急度は変えず、救急隊申し送りの情報項目として記録する。
    choices:
    - code: a
      text: はい
      affects_triage: false
    - code: b
      text: いいえ
      affects_triage: false
    - code: c
      text: 不明
      affects_triage: false
    source_pages:
    - 41
  - id: syncope_abdominal_pain
    question: お腹を痛がっていますか（したか）？
    suspected_condition: 子宮外妊娠・腹部大動脈切迫破裂
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      triage: Y2
      code_label: 2
      value: 'no'
      text: いいえ
      pdf_cell_blank: true
      note: PDF原本では b のセル空欄。fallback で Y2。
    - code: c
      triage: R3
      code_label: 3
      text: 不明
      affects_triage: false
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: convulsion
  name: けいれん
  source_pages:
  - 42
  - 43
  symptom_examples:
  - ひきつけ
  - てんかん
  - がたがた震えている
  - 泡を吹いている
  - 白目をむいている
  - けいれんを起こしている
  inherits:
  - common_vitals
  start_after_common_vitals: false
  start_node: convulsion_scope
  terminal_followup_chain:
  - convulsion_history_metadata
  flow_design_note: |
    v0.3 では convulsion_generalized_common / convulsion_focal_common という synthetic_node を
    入れて「protocol 内で共通バイタルを再実行」する設計だったが、これは PDF原本にない構造。
    v0.3.2 で synthetic node を削除し、PDF p.42-43 のフローを直接エッジで表現するように変更:
    - 全身性: convulsion_scope.a → convulsion_continues → (はい:R2 / いいえ→convulsion_breath_signal / 不明:R3)
    - 局所性: convulsion_scope.b → convulsion_pregnant (PDF p.43 で 局所性 ルートには breath_signal が無いため直接 pregnant へ)
    - convulsion_breath_signal.b (10秒未満 Y1) は accumulate_triage で baseline 記録のうえ convulsion_pregnant へ継続
    - 共通バイタルの再実行は前提とせず、entry_flow で実施済みの値を継承する設計
  nodes:
  - id: convulsion_scope
    question: 痙攣しているのは全身ですか。それとも、体の一部ですか。
    choices:
    - code: a
      code_label: 1
      value: generalized
      text: 全身性
      action: next
      next: convulsion_continues
    - code: b
      code_label: 2
      value: focal
      text: 局所性
      action: next
      next: convulsion_pregnant
      note: |
        PDF p.43 で 局所性ルートには breath_signal が無く、共通バイタル後すぐに
        個別質問（妊娠/糖尿病/予測）へ進む構造。共通バイタルは entry_flow で実行済みのため、
        ここでは直接 convulsion_pregnant へ遷移。
  - id: convulsion_continues
    question: (全身性の痙攣の場合が疑われる場合) けいれんは続いていますか？
    choices:
    - code: a
      code_label: 1    
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_breath_signal
      note: |
        PDF p.42 でこの「いいえ」branch は共通バイタル経由で Q3 breath_signal に到達する。
        共通バイタルは entry_flow で実施済みであり、ここまで convulsion に到達しているということは
        breathing が a (はい) だったということ（他の値だと共通バイタルで終端していたため）。
        したがって PDF の "(2-2-1=はい)" 条件は満たされ、breath_signal が常に発火する。
    - code: c
      code_label: 3
      value: unknown
      text: 不明
      triage: R3
  - id: convulsion_breath_signal
    question: (2-2-1が「はい」もしくは「不明」の場合) それでは、今から傷病者をみて、呼吸をする度に私に合図してください。
    choices:
    - code: a
      code_label: 1
      value: interval_10sec_or_more
      text: 10秒以上（死戦期呼吸）
      triage: R2
    - code: b
      code_label: 2
      value: under_10sec
      text: 10秒未満
      triage: Y1
      accumulate_triage: true
      action: next
      next: convulsion_pregnant
      note: |
        PDF p.42 Q4「上記、呼吸・循環・意識に異常がない全身の痙攣 → 次の質問」を反映。
        Y1 は終端ではなく baseline triage として記録し、後続の個別質問で R2 にアップグレードされ得る。
    - code: c
      code_label: 3
      value: unable
      text: 実施できず
      triage: R3
  - id: convulsion_pregnant
    question: (女性で12～50才の場合) 妊娠していますか？
    suspected_condition: 子癇
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_diabetes
      pdf_cell_blank: true
    - code: c
      code_label: 3
      value: unknown
      text: 不明
      pdf_cell_blank: true
      triage: R3
  - id: convulsion_diabetes
    question: 糖尿病と言われたことがありますか？
    suspected_condition: 低血糖・高血糖
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_predicted
      pdf_cell_blank: true
    - code: c
      code_label: 3
      value: unknown
      text: 不明
      pdf_cell_blank: true
      triage: R3
  - id: convulsion_predicted
    question: (まだ、痙攣が起きていないが、今後、痙攣の発生が予想される場合) まだ痙攣が起きていないが、今後起きる感じがするのですね？
    suspected_condition: てんかん
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
      triage: Y2
    - code: b
      triage: Y2
      code_label: 2
      value: 'no'
      text: いいえ
      pdf_cell_blank: true
      note: PDF原本でセル空欄。fallback「症候別すべていいえ Y2」で吸収。
  - id: convulsion_history_metadata
    phone_icon: ☎
    question: これまで、痙攣やてんかん（癲癇）を起こしたことがありますか？
    metadata_only: true
    note: |-
      v0.2 では誤って triage 質問 (Y2) として実装されていたが、PDF p.43 では ☎ (緊急度に
      影響しない情報項目) として表示されている。本版で metadata_only に降格。
      protocol レベルの terminal_followup_chain で参照される（緊急度判定後の情報収集）。
      スプレッドシートの対応表に基づき、metadata_only のまま回答値 a/b/c と生成コードの code_label 1/2/3 の対応を明示する。
    fix_history: 'v0.3で triage質問→metadata_only に修正'
    choices:
    - code: a
      code_label: 1
      value: 'yes'
      text: はい
    - code: b
      code_label: 2
      value: 'no'
      text: いいえ
    - code: c
      code_label: 3
      value: unknown
      text: 不明
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: headache
  name: 頭痛
  source_pages:
  - 44
  - 45
  symptom_examples:
  - 頭が痛い
  - 後頭部が痛い
  - 頭痛がすると言って倒れた
  inherits:
  - common_vitals
  start_after_common_vitals: true
