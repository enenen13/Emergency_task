implementation_notes:
- 判定実装では global_priority_rules → entry_flow → common_vitals → chief_complaint_router → symptom protocol の順で評価する。
- pdf_cell_blank フラグは「PDF原本でその triage セルが空欄であること」を示す。実装上は fallback で R3/Y2/G などに集約される。
- synthetic_choice / synthetic_node は機械が補完したノード/選択肢で、HUMAN_REVIEW.md で個別レビューが必要な箇所。
- pdf_no_disease_listed は想定疾患欄が PDF原本で空欄であることを示す（背部痛と腰部痛で疾患の配置が異なる箇所がある）。
- metadata_only / phone_icon: ☎ の項目は緊急度には影響せず、救急隊・医療機関への共有情報。
- accumulate_triage は「この選択肢の triage を baseline として記録するが、後続質問でアップグレードされうる」ことを示す（しびれプロトコルなど）。
- conditional_on は質問が条件付きであることを示す情報フラグ。実装側で参照する。
- MedNLP-CALL の4値分類へ変換する場合は labels.*.mednlp_call_mapping を使う。R3 を Very urgent に含めるのは119番プロトコル上「迅速な現場確認が必要」という扱いに基づく暫定対応。
validation:
  status: pdf_faithful_with_spreadsheet_code_alignment
  required_human_review_doc: HUMAN_REVIEW.md
  notes_v0_3:
  - PDF p.35-74 のテキストおよびラスタ画像（150 DPI）でのクロスチェックを実施
  - v0.2 で機械が補完していた合成選択肢のうち、PDFと矛盾するものを訂正
  - 残る合成項目（synthetic_choice / synthetic_node / pdf_cell_blank）は HUMAN_REVIEW.md に整理
  - 医療運用前には必ず原本PDF・原本フローチャート図（付録2）と最終クロスチェック必要
  - スプレッドシートの相違対応表に基づき、既存の choice.code を維持したまま code_label を付与して生成コードとの対応を明示
  - 多対1対応では元の選択肢・triage・oral_instruction を統合せず保持し、同じ code_label を複数 choice に付与
  - 'PDF原本にない「現在は痛くない」「現在は出血していない」等は synthetic: true で明示'