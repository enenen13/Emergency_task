metadata:
  name: 119番通報 緊急度判定プロトコル Ver.3 - protocol.yaml
  version: validated_v0.2
  created_from: /mnt/data/119_tuhou.pdf
  created_note: PDF由来の分岐データを、実装時に参照先が解決できるように接続補完・ID一意化・検証情報を追加した版。医学的運用前には原本照合と専門家レビューが必須。
  scope: 119番通報導入、共通バイタル、症候別21+1プロトコル（吐血・喀血を含む）
  source_page_basis: PDF pages 35-75 (document page numbers in footer), plus explanatory pages 1-7 for label definitions and
    algorithm.
labels:
  R1:
    category: 赤
    description: 心肺蘇生の必要性が強く疑われる病態
    mednlp_call_mapping: Very urgent
  R2:
    category: 赤
    description: 高度な医学的判断・処置の必要性が高く、その開始までの時間に急を要する病態
    mednlp_call_mapping: Very urgent
  R3:
    category: 赤
    description: R2より低いが、迅速な到着と搬送が必要、または状況不明で確認を要する病態
    mednlp_call_mapping: Very urgent
  Y1:
    category: 黄
    description: 医学的判断の必要性は高いが、R2/R3ほどの迅速性は必要ない病態
    mednlp_call_mapping: Semi-urgent
  Y2:
    category: 黄
    description: 医学的判断の必要性はR1〜Y1ほど高くないが医療機関受診が必要な病態
    mednlp_call_mapping: Semi-urgent
  G:
    category: 緑
    description: 赤、黄には該当しないが診察が必要な病態
    mednlp_call_mapping: Low urgency
oral_instructions:
  CPR: 心肺蘇生指導
  airway_obstruction: 気道異物除去指導
  hemostasis: 止血の口頭指導
  finger_toe_amputation: 指趾切断の口頭指導
  poisoning: 中毒の口頭指導
  positioning: 体位管理の口頭指導
global_priority_rules:
- id: cpa_keywords
  priority: 100
  match_any:
  - 呼吸なし
  - 脈なし
  - 水没
  - 冷たくなっている
  - 首をつった
  - 首を絞めた
  - 喉が詰まった
  - 意識なし
  triage: R1
  oral_instruction:
  - CPR
  - airway_obstruction
  source_pages:
  - 5
  - 35
  - 75
- id: convulsion_direct_route
  priority: 90
  match_any:
  - けいれん
  - 痙攣
  - ひきつけ
  route_to_protocol: convulsion
  source_pages:
  - 35
  - 75
entry_flow:
- id: intro_fire_or_emergency
  question: 火事ですか、救急ですか？
  choices:
  - code: a
    value: emergency
    text: 救急
    next: dispatch_location
  - code: b
    value: fire_or_other
    text: 火事、他
    route_to: non_medical_flow
  source_pages:
  - 35
- id: dispatch_location
  question: 救急車が出動する先の住所、電話番号の確認
  metadata_only: true
  source_pages:
  - 35
  next: overview
- id: overview
  question: どなたが、どうしましたか？
  extract:
  - chief_complaint
  - cpa_keywords
  - trauma_or_external_cause
  - convulsion
  - unknown
  source_pages:
  - 35
  next: injured_count
- id: injured_count
  question: 怪我をしたのは（病気なのは）何人ですか？
  source_pages:
  - 35
  next: caller_relation
- id: caller_relation
  question: 通報しているあなたは、どなた（家族の方、警察官の方）ですか？
  source_pages:
  - 35
  next: age
- id: age
  question: 年齢は、いくつぐらいですか？
  choices:
  - code: a
    text: 4歳以下、5-14歳、15-39歳、40-69歳、70歳以上、85歳以上
    next: sex
  - code: b
    text: 不明
    next: sex
  source_pages:
  - 35
- id: sex
  question: 患者は、男性（男の子）ですか、女性（女の子）ですか？
  choices:
  - code: a
    text: 男
    next: observation
  - code: b
    text: 女
    next: observation
  - code: c
    text: 不明
    next: observation
  source_pages:
  - 35
- id: observation
  question: 今、直接、患者をみることができますか？（目の前にいますか？など）
  choices:
  - code: a
    text: 容態を観察している・観察した
    next: common_breathing
  - code: b
    text: 容態を観察していないし、観察できない
    triage: R3
  source_pages:
  - 35
common_vitals:
- id: common_breathing
  source_pages:
  - 35
  - 36
  - 37
  - 38
  - 40
  - 46
  - 48
  - 50
  - 53
  - 55
  - 57
  - 59
  - 62
  - 63
  - 65
  - 67
  - 68
  - 69
  - 71
  - 73
  question: 呼吸は楽にしていますか？普段通りの呼吸ですか？
  slot: breathing_status
  choices:
  - code: a
    value: normal
    text: はい
    action: next
    next: common_cold_sweat
  - code: b
    value: no_breathing
    text: いいえ（呼吸なし）
    triage: R1
    oral_instruction:
    - CPR
  - code: c
    value: agonal_breathing
    text: いいえ（死戦期呼吸を疑う）
    triage: R1
    oral_instruction:
    - CPR
  - code: d
    value: snoring
    text: いいえ（いびき）
    triage: R2
  - code: e
    value: choking
    text: いいえ（窒息）
    triage: R1
    oral_instruction:
    - airway_obstruction
  - code: f
    value: dyspnea
    text: 呼吸が苦しそう
    triage: R2
  - code: g
    value: unknown
    text: 不明
    triage: R3
- id: common_cold_sweat
  question: 冷や汗をかいていますか？
  slot: cold_sweat
  choices:
  - code: a
    value: 'yes'
    text: はい
    triage: R2
  - code: b
    value: 'no'
    text: いいえ
    action: next
    next: common_face_color
  - code: c
    value: unknown
    text: 不明
    triage: R3
- id: common_face_color
  question: 顔色は悪いですか？
  slot: face_color
  choices:
  - code: a
    value: bad
    text: 悪い
    triage: R2
  - code: b
    value: normal
    text: 悪くない（いつもと同じ、赤色）
    action: next
    next: common_conversation
  - code: c
    value: unknown
    text: 不明
    triage: R3
- id: common_conversation
  question: 普通に話しができますか？
  slot: conversation_status
  choices:
  - code: a
    value: normal
    text: はい
    action: next
    next: chief_complaint_router
  - code: b
    value: confused
    text: いいえ（つじつまが合わない）
    triage: R2
  - code: c
    value: words_only
    text: いいえ（単語しか話せない）
    triage: R2
  - code: d
    value: groaning
    text: いいえ（うめき声のみ）
    triage: R2
  - code: e
    value: no_voice
    text: いいえ（声が全く出ない）
    triage: R2
  - code: f
    value: unclear_content
    text: いいえ（内容不明）
    triage: R2
  - code: g
    value: dyspnea_conversation_difficult
    text: いいえ（意識は問題がないが、呼吸苦で話しができない）途切れ途切れの会話
    triage: R2
  - code: i
    value: unknown
    text: 不明
    triage: R3
chief_complaint_router:
  id: chief_complaint_router
  source_pages:
  - 5
  - 6
  - 35
  - 75
  routes:
  - protocol: dyspnea
    match_any:
    - 息が苦しい
    - 呼吸が苦しい
    - 息苦しい
    - ゼーゼー
    - ヒューヒュー
    - 喘息
  - protocol: palpitation
    match_any:
    - 動悸
    - どきどきする
    - 胸がどきどきする
  - protocol: consciousness_disorder_syncope
    match_any:
    - 反応がない
    - 意識がない
    - 失神
    - 倒れた
    - 変なことを言う
  - protocol: convulsion
    match_any:
    - けいれん
    - 痙攣
    - ひきつけ
  - protocol: headache
    match_any:
    - 頭痛
    - 頭が痛い
    - 後頭部が痛い
  - protocol: chest_pain_nontraumatic
    match_any:
    - 胸が痛い
    - 胸が苦しい
    - 胸痛
  - protocol: back_pain
    match_any:
    - 背中が痛い
    - 背骨が痛い
    - 背部痛
  - protocol: adult_fever
    age_condition: age >= 16
    match_any:
    - 熱
    - 発熱
    - 熱が高い
  - protocol: abdominal_pain
    match_any:
    - おなかが痛い
    - 腹痛
    - みぞおちが痛い
    - 下腹が痛い
  - protocol: adult_nausea_vomiting
    age_condition: age >= 16
    match_any:
    - 吐いた
    - 吐き気
    - 嘔吐
  - protocol: dizziness
    match_any:
    - めまい
    - 目が回る
  - protocol: numbness
    match_any:
    - しびれ
    - 麻痺
    - 手足に力が入らない
    - 脳卒中
  - protocol: lumbar_pain
    match_any:
    - 腰が痛い
    - 腰痛
  - protocol: hematemesis_hemoptysis
    match_any:
    - 吐血
    - 喀血
    - 血を吐いた
  - protocol: melena_hematochezia
    match_any:
    - 下血
    - 血便
    - 便に血
  - protocol: malaise
    match_any:
    - 具合が悪い
    - 気分が悪い
    - 具合が悪そう
    - 気分が悪そう
  - protocol: trauma
    match_any:
    - けが
    - 怪我
    - 外傷
    - 交通事故
    - 転落
    - やけど
  - protocol: foreign_body_ingestion
    match_any:
    - 固形物
    - 飲み込んだ
    - 喉につかえた
    - 喉に引っかかった
  - protocol: poisoning
    match_any:
    - 中毒
    - 薬を飲んだ
    - ガスを吸った
    - 間違って飲んだ
  - protocol: pediatric_fever
    age_condition: age < 16
    match_any:
    - 熱
    - 発熱
    - 熱が高い
  - protocol: pediatric_nausea_vomiting
    age_condition: age < 16
    match_any:
    - 吐いた
    - 吐き気
    - 嘔吐
  - protocol: pediatric_head_neck_trauma
    age_condition: age < 16
    match_any:
    - 頭をぶつけた
    - 頭から血
    - 頭部外傷
    - 頸部外傷
protocols:
- id: dyspnea
  name: 呼吸困難
  source_pages:
  - 37
  symptom_examples:
  - 息が苦しい
  - 呼吸が苦しい
  - 息苦しい
  - 肩で息をしている
  - 息ができない
  - ゼーゼーいっている
  - ヒューヒューいっている
  - 喘息なんですが
  inherits:
  - common_vitals
  start_after_common_vitals: true
  nodes:
  - id: dyspnea_terminal
    question: 上記、呼吸・循環・意識に異常がない呼吸困難
    triage: R2
  - id: dyspnea_info_asthma
    question: 喘息の持病はありますか？
    metadata_only: true
  - id: dyspnea_info_inhaler
    question: 吸入薬を持っていますか？使用しましたか？
    metadata_only: true
  - id: dyspnea_info_homecare
    question: 在宅医療機器や、かかりつけ医からの特別な指示はありますか？それを行いましたか？
    metadata_only: true
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: R2
  notes: 呼吸困難は共通バイタルで異常なしでもR2。☎項目は搬送先共有情報で緊急度には影響しない。
- id: palpitation
  name: 動悸
  source_pages:
  - 38
  - 39
  symptom_examples:
  - どきどきする
  - 胸がどきどきする
  - 動悸がする
  inherits:
  - common_vitals
  start_after_common_vitals: true
  nodes:
  - id: palpitation_heart_history
    question: これまで心臓の異常を指摘されたことがありますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: palpitation_icd_fired
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 心疾患
    source_pages:
    - 39
  - id: palpitation_icd_fired
    question: 30分以内に体内式埋め込み型除細動器は、発動しましたか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: palpitation_chest_pain
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 体内式埋め込み型除細動器の発動
    source_pages:
    - 39
  - id: palpitation_chest_pain
    question: 胸痛はありますか？
    choices:
    - code: a-i
      value: yes_age_40_or_more
      text: はい・40歳以上
      triage: R2
    - code: a-ii
      value: yes_age_under_40
      text: はい・40歳未満
      triage: Y2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: palpitation_medication_info
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 急性冠症候群
  - id: palpitation_medication_info
    question: 12時間以内に、何か薬を使用しましたか？（治療薬や市販薬の薬品名）
    metadata_only: true
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: consciousness_disorder_syncope
  name: 意識障害／失神
  source_pages:
  - 40
  - 41
  symptom_examples:
  - 反応がない
  - 意識がないようだ
  - 変なことを言う
  - うわごとを言っている
  - いつもと様子が違う
  - 気を失った
  - 気を失いかけた
  inherits:
  - common_vitals
  start_after_common_vitals: true
  nodes:
  - id: syncope_breath_count
    question: 呼吸停止の可能性が否定できない場合、呼吸をする度に合図してください。
    choices:
    - code: a
      value: interval_10sec_or_more
      text: 10秒以上（死戦期呼吸）
      triage: R1
      oral_instruction:
      - CPR
    - code: b
      value: under_10sec
      text: 10秒未満
      action: next
      next: syncope_heart_history
    - code: c
      value: unable
      text: 実施できず
      triage: R3
    suspected_condition: 心停止
  - id: syncope_heart_history
    question: これまで心臓の異常を指摘されたことがありますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: syncope_abdominal_pain
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 心疾患・不整脈
  - id: syncope_abdominal_pain
    question: お腹を痛がっていますか（したか）？
    choices:
    - code: a
      value: yes_age_40_or_more
      text: はい・40歳以上
      triage: R2
    - code: a2
      value: yes_age_under_40
      text: はい・40歳未満
      triage: Y2
    - code: b
      value: 'no'
      text: いいえ
      triage: Y2
    suspected_condition: 子宮外妊娠・腹部大動脈切迫破裂
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: convulsion
  name: けいれん
  source_pages:
  - 42
  - 43
  symptom_examples:
  - ひきつけ
  - てんかん
  - がたがた震えている
  - 泡を吹いている
  - 白目をむいている
  - けいれんを起こしている
  inherits:
  - common_vitals
  start_after_common_vitals: true
  nodes:
  - id: convulsion_scope
    question: 痙攣しているのは全身ですか。それとも、体の一部ですか。
    choices:
    - code: a
      value: generalized
      text: 全身性
      next: convulsion_continues
    - code: b
      value: focal
      text: 局所性
      next: convulsion_focal_common
  - id: convulsion_focal_common
    question: 局所性けいれんの場合は共通バイタルを確認し、その後、症候別インタビューへ戻る。
    synthetic_node: true
    reason: 原本フローチャートでは「一部（局所）」からバイタルサインのインタビューへ接続しているが、抽出YAMLでは接続先ノードが未定義だったため補完。
    run_common_vitals: true
    resume_next: convulsion_pregnant
    source_pages:
    - 12
    - 13
    - 42
    - 43
  - id: convulsion_continues
    question: けいれんは続いていますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_breath_signal
    - code: c
      value: unknown
      text: 不明
      triage: R3
  - id: convulsion_breath_signal
    question: 全身性でけいれん停止中：呼吸をする度に合図してください。
    choices:
    - code: a
      value: interval_10sec_or_more
      text: 10秒以上（死戦期呼吸）
      triage: R2
    - code: b
      value: under_10sec
      text: 10秒未満
      triage: Y1
    - code: c
      value: unable
      text: 実施できず
      triage: R3
  - id: convulsion_pregnant
    question: 女性で12～50才の場合、妊娠していますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_diabetes
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 子癇
  - id: convulsion_diabetes
    question: 糖尿病と言われたことがありますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_history
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: 低血糖・高血糖
  - id: convulsion_history
    question: これまで、痙攣やてんかんを起こしたことがありますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: Y2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: convulsion_predicted
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: てんかん
  - id: convulsion_predicted
    question: まだ痙攣が起きていないが、今後起きる感じがするのですね？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: Y2
    - code: b
      value: 'no'
      text: いいえ
      triage: Y2
    - code: c
      value: unknown
      text: 不明
      triage: R3
  fallback:
    if_any_unknown: R3
    if_all_symptom_questions_negative: Y2
- id: headache
  name: 頭痛
  source_pages:
  - 44
  - 45
  symptom_examples:
  - 頭が痛い
  - 後頭部が痛い
  - 頭痛がすると言って倒れた
  inherits:
  - common_vitals
  start_after_common_vitals: true
  nodes:
  - id: headache_sudden_severe
    question: 激しい痛みが、突然起こりましたか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: headache_numbness_paralysis
    - code: c
      value: unknown
      text: 不明
      triage: R3
    suspected_condition: くも膜下出血
  - id: headache_numbness_paralysis
    question: しびれや麻痺がありますか？
    choices:
    - code: a
      value: 'yes'
      text: はい
      triage: R2
    - code: b
      value: 'no'
      text: いいえ
      action: next
      next: headache_abnormal_behavior
    - code: c
      value: unknown
      text: 不明
      triage: R3
