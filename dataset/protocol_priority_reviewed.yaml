implementation_notes:
- 判定実装では global_priority_rules -> entry_flow -> common_vitals -> chief_complaint_router -> symptom protocol の順で評価する。
- unknown/不明 は原則R3に倒す。ただしPDF上で別判定が明記された箇所は各nodeのchoicesを優先する。
- metadata_only または ☎ の項目は、緊急度には影響しないが救急隊・医療機関への共有情報として保持する。
- MedNLP-CALLの4値分類へ変換する場合は labels.*.mednlp_call_mapping を使う。R3をVery urgentに含めるのは迅速な現場確認が必要という119番プロトコル上の扱いに基づく暫定対応。
